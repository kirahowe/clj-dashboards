# Serving the dashboards server under a path prefix with nginx.
# The trailing slashes matter: nginx strips /dashboards/ before
# forwarding, and every URL the apps use is relative, so nothing else
# needs to know about the prefix.
location /dashboards/ {
    proxy_pass http://127.0.0.1:8080/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Each tab holds a long-lived server-sent event stream. The server
    # sends X-Accel-Buffering: no and a comment every 20s, but turning
    # buffering off here too does no harm.
    proxy_read_timeout 1h;
    proxy_buffering off;
}
