# nginx in front of the dashboards server: HTTPS, HTTP/2, and the apps
# under a /dashboards/ prefix. This goes in nginx's http {} context
# (for example /etc/nginx/conf.d/dashboards.conf). Replace
# dashboards.example.com and the certificate paths with your own.
#
# HTTP/2 matters here. Browsers open at most six HTTP/1.1 connections
# to a host, shared by all their tabs, and every open dashboard tab
# keeps one busy with its event stream. Over HTTP/2 the tabs share one
# connection. The server itself speaks HTTP/1.1, which is fine for the
# hop from nginx to it.

upstream dashboards {
    server 127.0.0.1:8080;

    # More than one replica? Each tab's session lives in one server's
    # memory, so keep each browser on one server. Add the servers and
    # use one of:
    #
    #   sticky cookie dsh_server path=/ httponly secure;  # nginx 1.29.6+ or nginx Plus
    #   hash $remote_addr consistent;                     # older nginx: by client IP
    #
    # See "Running it in production" in the README.

    # Reuse connections to the server (needs the HTTP/1.1 and empty
    # Connection header settings below).
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name dashboards.example.com;
    return 301 https://$host$request_uri;
}

server {
    # `http2 on;` needs nginx 1.25.1 or later. On older versions, remove
    # it and write `listen 443 ssl http2;` instead.
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dashboards.example.com;

    ssl_certificate     /etc/ssl/dashboards.example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/dashboards.example.com/privkey.pem;

    # The trailing slashes matter: nginx strips /dashboards/ before
    # forwarding, and every URL the apps use is relative, so the server
    # needs no setting for the prefix. To serve the apps at the root
    # instead, use `location /` and `proxy_pass http://dashboards;`, and
    # drop the proxy_redirect line.
    location /dashboards/ {
        proxy_pass http://dashboards/;
        # The server redirects /<app> to /<app>/; put the prefix back on.
        proxy_redirect / /dashboards/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Each tab holds a long-lived server-sent event stream. The
        # server sends X-Accel-Buffering: no and an event every 20s,
        # but turning buffering off here too does no harm.
        proxy_read_timeout 1h;
        proxy_buffering off;
    }
}
