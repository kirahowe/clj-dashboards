# Run the dashboards server with a directory of apps, behind Caddy for
# automatic HTTPS. Replace dashboards.example.com with your domain.
#
#   docker compose -f deploy/docker-compose.yml up -d
services:
  dashboards:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    volumes:
      - ../examples/apps:/srv/dashboards:ro
      # Cache for deps that individual apps add with their own deps.edn.
      - m2:/home/dashboards/.m2
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - dashboards

volumes:
  m2:
  caddy-data:
